services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: skillswap
      POSTGRES_PASSWORD: skillswap
      POSTGRES_DB: skillswap
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - skillswap-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "skillswap", "-d", "skillswap"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  skillswap-postgres:
