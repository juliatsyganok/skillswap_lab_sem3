name: CI

on:
  push:
    branches: [main, codex/lr4-d]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: skillswap
          POSTGRES_PASSWORD: skillswap
          POSTGRES_DB: skillswap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillswap -d skillswap_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

      - name: PostgreSQL integration and race
        env:
          SKILLSWAP_TEST_DATABASE_URL: postgres://skillswap:skillswap@127.0.0.1:5432/skillswap_test?sslmode=disable
        run: go test -race -tags=integration -count=1 ./...
